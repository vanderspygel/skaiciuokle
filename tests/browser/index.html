<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Testai</title>
<script type="importmap">
{ "imports": { "node:test": "./shim.js", "node:assert/strict": "./shim.js" } }
</script>
<style>
  body { font: 16px system-ui, sans-serif; margin: 24px; }
  .ok { color: #1a7f37; } .fail { color: #b42318; }
</style>
</head>
<body>
<h1>Testai</h1>
<p id="sum">Vykdoma…</p>
<ul id="list"></ul>
<script type="module">
  import { results } from './shim.js';
  await import('../math.test.js');
  await import('../rewards.test.js');
  const list = document.getElementById('list');
  for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'ok' : 'fail';
    li.textContent = (r.ok ? '✔ ' : '✘ ') + r.name + (r.ok ? '' : ' — ' + r.error);
    list.append(li);
  }
  const failed = results.filter(r => !r.ok).length;
  document.getElementById('sum').textContent = `${results.length - failed}/${results.length} praėjo`;
  document.title = failed ? 'FAIL' : 'PASS';
</script>
</body>
</html>
